name: SonarQube Analysis

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: sonarqube-workflows-bp-sre
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      SONAR_PROJECT_KEY: TEGRASW_metropolis_video-search-and-summarization_video-search-and-summarization
      SONAR_PROJECT_NAME: video-search-and-summarization

    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate SonarQube secrets
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "SONAR_HOST_URL secret is required."
            exit 1
          fi
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN secret is required."
            exit 1
          fi

      - name: Write SonarQube configuration
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          cat > sonar-project.properties <<EOF
          sonar.projectKey=${SONAR_PROJECT_KEY}
          sonar.projectName=${SONAR_PROJECT_NAME}
          sonar.projectVersion=1.0.0
          sonar.sourceEncoding=UTF-8
          sonar.scm.provider=git
          sonar.qualitygate.wait=true

          sonar.sources=services/agent/src,services/ui/apps,services/ui/packages,skills
          sonar.tests=services/agent/tests
          sonar.python.version=3.13

          sonar.exclusions=**/node_modules/**,**/.venv/**,**/__pycache__/**,**/.mypy_cache/**,**/.ruff_cache/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx,**/*.spec.ts,**/*.spec.tsx
          sonar.test.inclusions=services/agent/tests/**/*.py
          EOF

          if [ "$EVENT_NAME" = "pull_request" ]; then
            {
              echo "sonar.pullrequest.key=${PR_NUMBER}"
              echo "sonar.pullrequest.branch=${PR_HEAD_REF}"
              echo "sonar.pullrequest.base=${PR_BASE_REF}"
            } >> sonar-project.properties
          elif [ -n "${GITHUB_REF_NAME:-}" ]; then
            echo "sonar.branch.name=${GITHUB_REF_NAME}" >> sonar-project.properties
          fi

          sed -E 's/(sonar.token|SONAR_TOKEN).*/[REDACTED]/g' sonar-project.properties

      - name: Run SonarQube scanner
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Check SonarQube quality gate
        uses: SonarSource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496 # v1
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
