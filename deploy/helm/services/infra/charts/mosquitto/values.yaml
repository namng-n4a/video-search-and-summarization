# Mirror of the mosquitto service in deploy/docker/services/infra/compose.yml
# (profiles: bp_wh_kafka_mv3dt, bp_wh_redis_mv3dt). Disabled by default; the MV3DT
# parent / industry-profile umbrella is responsible for setting enabled: true.
enabled: false
global: {}
replicas: 1
image:
  repository: eclipse-mosquitto
  tag: "2"
  pullPolicy: IfNotPresent
# MQTT TCP port. Compose uses ${MQTT_PORT:-1883}.
port: 1883
# Compose mounts services/infra/mosquitto/configs/mosquitto.conf into the container; the
# default below mirrors that file verbatim. Override via mosquitto.config to inject auth,
# listeners, persistence, etc.
config: |
  allow_anonymous true
  set_tcp_nodelay true
service:
  type: ClusterIP
resources: {}
nodeSelector: {}
tolerations: []
